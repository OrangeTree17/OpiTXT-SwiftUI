name: OpiTXT
options:
  bundleIdPrefix: com.oxtxt
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGNING_REQUIRED: "NO"
    ENABLE_HARDENED_RUNTIME: "NO"
targets:
  OpiTXT:
    type: application
    platform: macOS
    sources:
      - path: Sources
      - path: Previews
    settings:
      base:
        INFOPLIST_FILE: Packaging/Info.plist
        PRODUCT_NAME: OpiTXT
        PRODUCT_BUNDLE_IDENTIFIER: com.oxtxt.app
        GENERATE_INFOPLIST_FILE: "NO"
        COMBINE_HIDPI_IMAGES: "YES"
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
    postBuildScripts:
      - name: 拷贝图标
        basedOnDependencyAnalysis: false
        script: |
          cp "$SRCROOT/Packaging/icon.icns" "$TARGET_BUILD_DIR/$CONTENTS_FOLDER_PATH/Resources/icon.icns"
